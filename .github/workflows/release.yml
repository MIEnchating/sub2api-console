name: Release
on:
  push:
    tags: ["v*"]
permissions: {}
concurrency:
  group: release-publication
  cancel-in-progress: false
env:
  IMAGE: mienvirtuoso/sub2api-console
  REGISTRY: docker.io
  DOCKERHUB_USERNAME: mienvirtuoso
jobs:
  source:
    name: Validate release and reuse CI
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.ci.outputs.reuse }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Validate release source and notes
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node .github/scripts/validate-release-tag.mjs "$GITHUB_REF_NAME"
      - name: Reuse successful CI for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-ci.mjs

  checks:
    name: Full checks when CI cannot be reused
    needs: source
    if: needs.source.outputs.reuse != 'true'
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  preflight:
    name: Mandatory release preflight
    needs: [source, checks]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require successful CI or full checks
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          REUSE_CI: ${{ needs.source.outputs.reuse }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          test "$SOURCE_RESULT" = success
          if [ "$REUSE_CI" = true ]; then
            test "$CHECKS_RESULT" = skipped
          else
            test "$CHECKS_RESULT" = success
          fi

  build-and-push:
    needs: preflight
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Check Docker Hub token
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: test -n "$DOCKERHUB_TOKEN"
      - uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4
        with:
          registry: https://index.docker.io/v1/
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify release order and existing version
        id: version
        run: node .github/scripts/prepare-release-image.mjs
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        if: steps.version.outputs.reuse != 'true'
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image
          build-args: |
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
      - name: Verify both architectures and promote latest
        run: node .github/scripts/promote-release-image.mjs

  create-release:
    name: Create GitHub Release
    needs: build-and-push
    if: ${{ !cancelled() && needs.build-and-push.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file ".github/release-notes/$GITHUB_REF_NAME.md"
