name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Mandatory checks
    uses: ./.github/workflows/quality.yml

  docker:
    name: Docker build preflight
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build application image
        run: docker build --build-arg VERSION=ci-${GITHUB_SHA::12} -t sub2api-console:ci -f backend/Dockerfile .
