name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    name: Deployment configuration checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Validate deployment configuration
        run: node --test .github/scripts/*.test.mjs

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.22"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format check
        run: bun run format:check
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Dead code
        run: bun run deadcode
      - name: Test
        run: bun run test
      - name: Install browser
        run: bun x playwright install --with-deps chromium
      - name: Browser regressions
        id: browser
        run: bun run test:e2e
      - name: Preserve browser failure diagnostics
        if: ${{ failure() && steps.browser.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-diagnostics
          path: frontend/test-results/
          retention-days: 7
      - name: Production build
        run: bun run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Vet
        run: go vet ./... ./internal/management/__tests__ ./internal/newapimanagement/__tests__ ./internal/notification/__tests__ ./internal/officialpricing/__tests__ ./internal/onboarding/__tests__ ./internal/pricing/__tests__ ./internal/routing/__tests__ ./internal/upstreamsync/__tests__
      - name: Race tests
        run: go test -race ./... ./internal/management/__tests__ ./internal/newapimanagement/__tests__ ./internal/notification/__tests__ ./internal/officialpricing/__tests__ ./internal/onboarding/__tests__ ./internal/pricing/__tests__ ./internal/routing/__tests__ ./internal/upstreamsync/__tests__
      - name: Build
        run: go build ./...

  docker:
    name: Docker build preflight
    needs: [configuration, frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build application image
        run: docker build --build-arg VERSION=ci-${GITHUB_SHA::12} -t sub2api-console:ci -f backend/Dockerfile .
